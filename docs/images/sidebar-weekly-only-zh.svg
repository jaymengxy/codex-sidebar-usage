<svg xmlns="http://www.w3.org/2000/svg" width="552" height="372" viewBox="0 0 552 372" role="img" aria-label="仅每周额度进度条和重置时间浮窗示例">
<title>仅每周额度（示例）</title>
<defs>
  <linearGradient id="left" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#343434"/><stop offset="1" stop-color="#292929"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="552" height="372" fill="#292929"/>
<path d="M0 0H104V342Q104 371 76 371H30Q0 371 0 342Z" fill="url(#left)" stroke="#424242"/>
<line x1="104" y1="0" x2="104" y2="372" stroke="#424242" stroke-width="1"/>
<!-- only the weekly quota is present -->
<text x="52" y="47" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#a6a6a6" text-anchor="middle">7d</text>
<text x="52" y="75" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f5f5" text-anchor="middle">73%</text>
<rect x="20" y="90" width="64" height="6" rx="3" fill="#666666"/>
<rect x="20" y="90" width="47" height="6" rx="3" fill="#d97706"/>
<!-- refresh -->
<path d="M62 162a13 13 0 1 0 3 9M62 154v8h-8" fill="none" stroke="#eeeeee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- generic round user avatar (illustrative) -->
<circle cx="52" cy="337" r="24" fill="#dae6ec" stroke="#c4cbd1" stroke-width="2"/>
<path d="M35 349Q32 329 36 321L44 316L52 320L61 316L69 323Q73 336 69 350" fill="#f5e9d6" stroke="#373737" stroke-width="2"/>
<circle cx="52" cy="341" r="16" fill="#f6dba3" stroke="#3a3329" stroke-width="1.7"/>
<circle cx="47" cy="340" r="1.5" fill="#484032"/><circle cx="57" cy="340" r="1.5" fill="#484032"/>
<path d="M48 347Q52 350 56 347" fill="none" stroke="#6e5741" stroke-width="1.6" stroke-linecap="round"/>
<!-- floating quota details -->
<rect x="110" y="58" width="424" height="234" rx="20" fill="#090909" opacity=".25" filter="url(#shadow)"/>
<rect x="109" y="53" width="425" height="229" rx="20" fill="#252525" stroke="#454545" stroke-width="2"/>
<g fill="#f2f2f2" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="21">
<text x="137" y="101">每周额度</text>
<text x="137" y="145">剩余：73%</text>
<text x="137" y="189">重置：2026/10/30 03:39:56</text>
<text x="137" y="233">更新：00:04:02</text>
</g>
</svg>