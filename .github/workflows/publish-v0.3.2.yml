name: Publish v0.3.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: "${{ startsWith(github.event.head_commit.message, 'release: v0.3.2') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.3.2 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3.2 >/dev/null 2>&1; then
            echo "v0.3.2 already published."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/v0.3.2-notes.md" <<'NOTES'
          ## Codex Sidebar Usage v0.3.2

          ### What's new
          - Automatic Chinese/English UI for macOS Swift Launcher, Terminal monitoring logs, and build/install steps. Chinese macOS preferred locale shows Chinese; all other languages use English.
          - ChatGPT sidebar quota reset-time popover follows the renderer's declared interface language where available, with a system/browser locale fallback and localized date/time.
          - Stable internal monitoring events avoid reliance on localized log text.
          - English README now features an English quota/reset-time screenshot; Simplified Chinese README retains the Chinese example.
          - Source code is licensed under the **MIT License**. OpenAI / ChatGPT logos, names and other third-party assets are not included in that license.

          ### Installation
          This GitHub release includes **source archives only**, not a prebuilt or notarized macOS application.
          On macOS with Node.js 22+, use `npm run launch`, or build the native AppKit Launcher with
          `npm run launcher:build && npm run launcher:install` (requires Xcode Command Line Tools).

          Read [English README](https://github.com/jaymengxy/codex-sidebar-usage/blob/v0.3.2/README.md) or [简体中文](https://github.com/jaymengxy/codex-sidebar-usage/blob/v0.3.2/README.zh-CN.md).

          ### Compatibility
          Unofficial integration using local-only CDP, not an OpenAI-endorsed plugin.
          The English quota popover was visually confirmed on the user's Mac; CI passed Node tests in Chinese and English, Shell checks and Swift/AppKit compilation.
          Behavior across other ChatGPT builds and every independent language setting is not guaranteed.
          NOTES
          gh release create v0.3.2 --target "${RELEASE_SHA}" \
            --title "Codex Sidebar Usage v0.3.2" \
            --notes-file "${RUNNER_TEMP}/v0.3.2-notes.md" \
            --latest
