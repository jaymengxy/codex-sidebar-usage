name: Publish v0.3.1

# One-time publish gate: only the explicitly named squash merge into main.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: "${{ startsWith(github.event.head_commit.message, 'release: v0.3.1') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.3.1 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3.1 >/dev/null 2>&1; then
            echo "v0.3.1 release already exists; nothing to do."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/v0.3.1-notes.md" <<'NOTES'
          ## Codex Sidebar Usage v0.3.1

          First release with the native **Swift/AppKit Codex Usage Launcher.app** and resilient quota display in the left navigation bar of the macOS ChatGPT client.

          ### Features
          - Remaining five-hour and weekly Codex quota percentages with green/orange progress bars.
          - Click-to-view quota reset time; manual, hover-triggered and periodic refresh.
          - Automatic widget recovery after ChatGPT renderer reload or sidebar re-render.
          - Native double-click Launcher with monitoring controls, local logs, and Node/Codex binary selection.
          - One-command Terminal launch: `npm run launch`.
          - Native icon based on the locally installed ChatGPT icon, with two decorative progress bars at the lower left, preserving the original macOS icon size.
          - English and Simplified Chinese installation and usage guides.

          ### Install
          This release contains **source code**, not a signed prebuilt macOS .app.
          Clone the repository, install Node.js 22+ and Xcode Command Line Tools, then choose:
          - Terminal: `npm run launch`
          - Native app: `npm run launcher:build && npm run launcher:install`

          For details, read [English README](https://github.com/jaymengxy/codex-sidebar-usage/blob/v0.3.1/README.md) or [简体中文](https://github.com/jaymengxy/codex-sidebar-usage/blob/v0.3.1/README.zh-CN.md).

          ### Compatibility and safety
          Unofficial, local-only CDP integration, tested with ChatGPT desktop build `26.1021.31345` on macOS. Requires `/Applications/ChatGPT.app` and Node 22+. It does not patch ChatGPT.app or extract login tokens. Public distribution is **not** notarized.

          Core startup/recovery was user-accepted; the final icon proportion was also confirmed. Other ChatGPT releases, optional login LaunchAgent, and some new interaction edge cases have not been independently device-verified.
          NOTES
          gh release create v0.3.1 --target "${RELEASE_SHA}" \
            --title "Codex Sidebar Usage v0.3.1" \
            --notes-file "${RUNNER_TEMP}/v0.3.1-notes.md" \
            --latest
          echo "Published v0.3.1 from ${RELEASE_SHA}"
